    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* [نفس الـ CSS السابق بدون تغيير] */
        :root {
            --primary-color: #F97316;
            --primary-light: #FB923C;
            --primary-dark: #EA580C;
            --bg-dark: #0a0a0a;
            --bg-card: rgba(255, 255, 255, 0.05);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.5);
            --border-color: rgba(255, 255, 255, 0.1);
            --border-hover: rgba(249, 115, 22, 0.4);
            --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 5px 20px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 10px 40px rgba(0, 0, 0, 0.5);
            --transition: 0.3s ease;
            --border-radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        #particles-js {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 1000;
            transition: var(--transition);
        }

        nav.scrolled {
            padding: 15px 50px;
            box-shadow: var(--shadow-md);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .logo-img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary-color);
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary-color);
            letter-spacing: 2px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: var(--transition);
            position: relative;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--primary-color);
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--primary-color);
            transition: var(--transition);
        }

        .nav-links a:hover::after,
        .nav-links a.active::after {
            width: 100%;
        }

        .language-toggle {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            transition: var(--transition);
        }

        .language-toggle:hover {
            border-color: var(--primary-color);
            background: rgba(249, 115, 22, 0.1);
        }

        .menu-toggle {
            display: none;
            flex-direction: column;
            cursor: pointer;
            gap: 5px;
        }

        .menu-toggle span {
            width: 25px;
            height: 2px;
            background: var(--text-primary);
            transition: var(--transition);
        }

        section {
            padding: 120px 20px 60px;
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 800;
            text-align: center;
            margin-bottom: 50px;
            position: relative;
        }

        .section-title span {
            color: var(--primary-color);
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, var(--primary-color), var(--primary-light));
            border-radius: 3px;
        }

        .page-navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
            font-size: 0.9rem;
        }

        .back-link:hover {
            color: var(--primary-color);
        }

        .projects-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            width: 100%;
        }

        .project-card {
            background: var(--bg-card);
            border-radius: var(--border-radius);
            overflow: hidden;
            transition: var(--transition);
            border: 1px solid var(--border-color);
        }

        .project-card:hover {
            transform: translateY(-5px);
            border-color: var(--border-hover);
            box-shadow: var(--shadow-md);
        }

        .project-preview {
            width: 100%;
            height: 200px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid var(--border-color);
            position: relative;
        }

        .project-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition);
        }

        .project-card:hover .project-preview img {
            transform: scale(1.05);
        }

        .project-preview-placeholder {
            font-size: 3rem;
            color: var(--primary-light);
        }

        .project-content {
            padding: 20px;
        }

        .project-content h3 {
            color: var(--text-primary);
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .project-content p {
            color: var(--text-secondary);
            font-size: 0.85rem;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .project-tech {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;

            background: rgba(249, 115, 22, 0.1);
            color: var(--primary-light);

            display: inline-flex;
            align-items: center;

            text-decoration: none;

        .social-link:hover {
            background: rgba(249, 115, 22, 0.1);
            border-color: var(--primary-color);
            color: var(--primary-color);
            transform: translateY(-3px);
        }

        .footer-bottom {
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .whatsapp-button {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 50px;
            height: 50px;
            background: #25D366;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
            box-shadow: 0 5px 20px rgba(37, 211, 102, 0.4);
            z-index: 999;
            transition: var(--transition);
            text-decoration: none;
        }

        .whatsapp-button:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 30px rgba(37, 211, 102, 0.6);
        }

        .fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            background: var(--primary-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(249, 115, 22, 0.4);
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
        }

        .fab.show {
            opacity: 1;
            visibility: visible;
        }

        .fab:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(249, 115, 22, 0.6);
        }

        @media (max-width: 1024px) {
            nav {
                padding: 20px 30px;
            }
        }

        @media (max-width: 768px) {
            nav {
                padding: 15px 20px;

            .menu-toggle {
                display: flex;
            }

            .nav-links {
                position: fixed;
                top: 70px;
                right: -100%;
                width: 100%;
                height: calc(100vh - 70px);
                background: rgba(10, 10, 10, 0.95);
                backdrop-filter: blur(10px);
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 30px;
                transition: var(--transition);

            .nav-links.active {

            .nav-links a {

            section {

            .projects-container {
                grid-template-columns: 1fr;

            }

            .project-preview {
                height: 180px;
            }
        }

        @media (max-width: 480px) {
            nav {
                padding: 10px 15px;
            }

            .logo-img {
                width: 30px;
                height: 30px;
            }

            .logo-text {

            }

            section {
                padding: 90px 10px 30px;

            .whatsapp-button,
            .fab {
                width: 40px;
                height: 40px;
                font-size: 1.2rem;
                bottom: 20px;
            }

            .whatsapp-button {
                left: 20px;
            }

            .fab {
                right: 20px;
            }

            .footer-content {
                padding: 0 10px;
            }
        }

        html[lang="ar"] body {
            direction: rtl;
        }

        html[lang="ar"] .back-link i {
            transform: scaleX(-1);
        }

    <script>
        // ============================================
        // OOP Implementation for Projects Management
        // ============================================

        /**
         * Project Class - Represents a single project
         * 
         * @param {Object} config - Project configuration object
         * @param {string} config.title - Project title (required)
         * @param {string} config.description - Project description (required)
         * @param {string[]} config.tech - Array of technologies used (required)
         * @param {string} config.link - Project URL (required)
         * @param {string} [config.icon] - Font Awesome icon class (optional, default: 'fa-globe')
         * @param {string} [config.image] - Custom image URL (optional, if not provided will auto-generate screenshot)
         * @param {string} [config.category] - Project category (optional, default: 'web')
         * @param {boolean} [config.featured] - Whether project is featured (optional, default: false)
         * @param {Date|string} [config.date] - Project date (optional)
         * @param {string[]} [config.tags] - Additional tags (optional)
         */
        class Project {
            constructor(config) {
                // Validation
                if (!config.title) throw new Error('Project title is required');
                if (!config.description) throw new Error('Project description is required');
                if (!config.link) throw new Error('Project link is required');

                // Required properties
                this.title = config.title;
                this.description = config.description;
                this.link = config.link;
                this.tech = config.tech || [];

                // Optional properties with defaults
                this.icon = config.icon || 'fa-globe';
                this.image = config.image || null;
                this.category = config.category || 'web';
                this.featured = config.featured || false;
                this.date = config.date || new Date();
                this.tags = config.tags || [];

                // Generate unique ID
                this.id = this.generateId();
            }

            /**
             * Generate a unique ID for the project
             * @returns {string} Unique identifier
             */
            generateId() {
                const timestamp = Date.now().toString(36);
                const random = Math.random().toString(36).substr(2, 5);
                return `project-${timestamp}-${random}`;
            }

            /**
             * Get the screenshot URL for the project
             * @returns {string} Screenshot URL
             */
            getScreenshotUrl() {
                if (this.image) {
                    return this.image;
                }
                // Use Microlink API to generate screenshot
                return `https://api.microlink.io/?url=${encodeURIComponent(this.link)}&screenshot=true&meta=false&embed=screenshot.url`;
            }

            /**
             * Get formatted date string
             * @returns {string} Formatted date
             */
            getFormattedDate() {
                const date = this.date instanceof Date ? this.date : new Date(this.date);
                return date.toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
            }

            /**
             * Convert project to JSON object
             * @returns {Object} Plain object representation
             */
            toJSON() {
                return {
                    id: this.id,
                    title: this.title,
                    description: this.description,
                    tech: this.tech,
                    link: this.link,
                    icon: this.icon,
                    image: this.image,
                    category: this.category,
                    featured: this.featured,
                    date: this.date,
                    tags: this.tags
                };
            }

            /**
             * Create a Project instance from JSON
             * @param {Object} json - JSON object
             * @returns {Project} Project instance
             */
            static fromJSON(json) {
                return new Project(json);
            }
        }

        /**
         * ProjectManager Class - Manages collection of projects
         * Handles CRUD operations and rendering
         */
        class ProjectManager {
            constructor() {
                /** @type {Project[]} */
                this.projects = [];
            }

            /**
             * Add a new project to the collection
             * @param {Project|Object} project - Project instance or config object
             * @returns {Project} The added project
             */
            addProject(project) {
                const projectInstance = project instanceof Project ? project : new Project(project);
                this.projects.push(projectInstance);
                return projectInstance;
            }

            /**
             * Add multiple projects at once
             * @param {Array<Project|Object>} projects - Array of projects
             * @returns {Project[]} Added projects
             */
            addProjects(projects) {
                return projects.map(project => this.addProject(project));
            }

            /**
             * Remove a project by ID
             * @param {string} id - Project ID
             * @returns {boolean} Success status
             */
            removeProject(id) {
                const initialLength = this.projects.length;
                this.projects = this.projects.filter(p => p.id !== id);
                return this.projects.length < initialLength;
            }

            /**
             * Update a project by ID
             * @param {string} id - Project ID
             * @param {Object} updates - Updated properties
             * @returns {Project|null} Updated project or null
             */
            updateProject(id, updates) {
                const index = this.projects.findIndex(p => p.id === id);
                if (index === -1) return null;

                // Create new project with merged properties
                const currentProject = this.projects[index];
                const mergedConfig = {
                    ...currentProject.toJSON(),
                    ...updates
                };
                delete mergedConfig.id; // Remove old ID

                const updatedProject = new Project(mergedConfig);
                updatedProject.id = id; // Preserve original ID
                this.projects[index] = updatedProject;
                return updatedProject;
            }

            /**
             * Get a project by ID
             * @param {string} id - Project ID
             * @returns {Project|null} Project or null
             */
            getProject(id) {
                return this.projects.find(p => p.id === id) || null;
            }

            /**
             * Get all projects
             * @returns {Project[]} All projects
             */
            getAllProjects() {
                return [...this.projects];
            }

            /**
             * Filter projects by category
             * @param {string} category - Category to filter by
             * @returns {Project[]} Filtered projects
             */
            filterByCategory(category) {
                return this.projects.filter(p => p.category === category);
            }

            /**
             * Get featured projects
             * @returns {Project[]} Featured projects
             */
            getFeaturedProjects() {
                return this.projects.filter(p => p.featured);
            }

            /**
             * Search projects
             * @param {string} query - Search query
             * @returns {Project[]} Matching projects
             */
            searchProjects(query) {
                const searchTerm = query.toLowerCase();
                return this.projects.filter(project => {
                    const searchableText = [
                        project.title,
                        project.description,
                        ...project.tech,
                        ...project.tags
                    ].join(' ').toLowerCase();
                    return searchableText.includes(searchTerm);
                });
            }

            /**
             * Sort projects by date
             * @param {boolean} ascending - Sort order (default: false = newest first)
             * @returns {Project[]} Sorted projects
             */
            sortByDate(ascending = false) {
                return [...this.projects].sort((a, b) => {
                    const dateA = new Date(a.date);
                    const dateB = new Date(b.date);
                    return ascending ? dateA - dateB : dateB - dateA;
                });
            }

            /**
             * Get statistics about projects
             * @returns {Object} Statistics
             */
            getStatistics() {
                const stats = {
                    total: this.projects.length,
                    featured: this.getFeaturedProjects().length,
                    categories: {},
                    technologies: {}
                };

                this.projects.forEach(project => {
                    // Count categories
                    stats.categories[project.category] = (stats.categories[project.category] || 0) + 1;
                    
                    // Count technologies
                    project.tech.forEach(tech => {
                        stats.technologies[tech] = (stats.technologies[tech] || 0) + 1;
                    });
                });

                return stats;
            }

            /**
             * Render all projects to the container
             * @param {string} containerId - Container element ID
             * @param {Object} options - Render options
             * @param {boolean} options.showDate - Show project date
             * @param {boolean} options.showCategory - Show project category
             * @param {Function} options.filter - Filter function
             * @param {Function} options.sort - Sort function
             */
            renderProjects(containerId, options = {}) {
                const container = document.getElementById(containerId);
                if (!container) {
                    console.error(`Container with ID "${containerId}" not found`);
                    return;
                }

                // Apply filters and sorting
                let projects = [...this.projects];
                
                if (options.filter && typeof options.filter === 'function') {
                    projects = projects.filter(options.filter);
                }
                
                if (options.sort && typeof options.sort === 'function') {
                    projects.sort(options.sort);
                }

                if (projects.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state" style="grid-column: 1/-1; text-align: center; padding: 50px;">
                            <i class="fas fa-folder-open" style="font-size: 3rem; color: var(--text-muted);"></i>
                            <p style="margin-top: 20px; color: var(--text-secondary);">No projects found</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = projects.map(project => this.renderProjectCard(project, options)).join('');
            }

            /**
             * Render a single project card
             * @param {Project} project - Project instance
             * @param {Object} options - Render options
             * @returns {string} HTML string
             */
            renderProjectCard(project, options = {}) {
                const screenshotUrl = project.getScreenshotUrl();
                const showDate = options.showDate || false;
                const showCategory = options.showCategory || false;
                const showFeatured = options.showFeatured || false;

                return `
                    <div class="project-card" data-project-id="${project.id}">
                        <div class="project-preview">
                            <img src="${screenshotUrl}" 
                                 alt="${project.title} preview" 
                                 loading="lazy"
                                 onerror="this.onerror=null; this.parentNode.innerHTML='<div class=\\'project-preview-placeholder\\'><i class=\\'fas ${project.icon}\\'></div>'">
                        </div>
                        <div class="project-content">
                            <h3>
                                ${project.title}
                                ${project.featured ? '<span class="featured-badge"><i class="fas fa-star"></i> Featured</span>' : ''}
                            </h3>
                            ${showDate ? `<p class="project-date"><i class="fas fa-calendar"></i> ${project.getFormattedDate()}</p>` : ''}
                            ${showCategory ? `<p class="project-category"><i class="fas fa-folder"></i> ${project.category}</p>` : ''}
                            <p>${project.description}</p>
                            <div class="project-tech">
                                ${project.tech.map(tech => `<span class="tech-tag">${tech}</span>`).join('')}
                            </div>
                            ${project.tags.length > 0 ? `
                                <div class="project-tags">
                                    ${project.tags.map(tag => `<span class="tag">#${tag}</span>`).join('')}
                                </div>
                            ` : ''}
                            <div class="project-links">
                                <a href="${project.link}" class="project-link" target="_blank" rel="noopener noreferrer">
                                    <i class="fas fa-external-link-alt"></i> ${options.viewProjectText || 'View Project'}
                                </a>
                                ${options.showDetails ? `
                                    <button class="project-link" onclick="openProjectDetails('${project.id}')">
                                        <i class="fas fa-info-circle"></i> Details
                                    </button>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                `;
            }
        }
